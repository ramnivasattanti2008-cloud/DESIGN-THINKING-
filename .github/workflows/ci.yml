name: MIRROR CI

on:
  push:
    branches: [ main, "ag-*", "claude/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Full Pytest Suite (Smoke, Policy Red-Team, Core Loop & Guarantees)
        run: |
          pytest -v

      - name: Enforce Golden Invariant (Zero Completion Without Verification)
        run: |
          pytest tests/smoke/test_verification_invariant.py -v
