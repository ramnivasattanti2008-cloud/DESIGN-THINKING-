<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Corner Brackets -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#00F0FF" stroke-width="3" fill="none" filter="url(#glow)" />
  <path d="M 150 20 L 180 20 L 180 50" stroke="#00F0FF" stroke-width="3" fill="none" filter="url(#glow)" />
  <path d="M 180 150 L 180 180 L 150 180" stroke="#00F0FF" stroke-width="3" fill="none" filter="url(#glow)" />
  <path d="M 50 180 L 20 180 L 20 150" stroke="#00F0FF" stroke-width="3" fill="none" filter="url(#glow)" />
  
  <!-- Center Crosshairs -->
  <line x1="100" y1="75" x2="100" y2="90" stroke="#00F0FF" stroke-width="2" />
  <line x1="100" y1="110" x2="100" y2="125" stroke="#00F0FF" stroke-width="2" />
  <line x1="75" y1="100" x2="90" y2="100" stroke="#00F0FF" stroke-width="2" />
  <line x1="110" y1="100" x2="125" y2="100" stroke="#00F0FF" stroke-width="2" />
  
  <!-- Central Target Ring -->
  <circle cx="100" cy="100" r="14" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 2" fill="none" />
</svg>
